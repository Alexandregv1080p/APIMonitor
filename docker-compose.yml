name: apimonitor

services:
  postgres:
    image: postgres:16-alpine
    container_name: apimonitor-postgres
    environment:
      POSTGRES_DB: apimonitor
      POSTGRES_USER: ${POSTGRES_USER:-apimonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apimonitor_dev}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d apimonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: apimonitor-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-apimonitor}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-apimonitor_dev}
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: apimonitor-api:local
    container_name: apimonitor-api
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=apimonitor;Username=${POSTGRES_USER:-apimonitor};Password=${POSTGRES_PASSWORD:-apimonitor_dev}"
      ConnectionStrings__Mongo: "mongodb://${MONGO_USER:-apimonitor}:${MONGO_PASSWORD:-apimonitor_dev}@mongodb:27017/apimonitor?authSource=admin"
      Database__MigrateOnStartup: "true" # uma instância só; ver README para múltiplas réplicas
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-8095}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend/api-monitor-web
    image: apimonitor-web:local
    container_name: apimonitor-web
    ports:
      - "${WEB_PORT:-3400}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:

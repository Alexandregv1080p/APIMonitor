name: apimonitor

services:
  postgres:
    image: postgres:16-alpine
    container_name: apimonitor-postgres
    environment:
      POSTGRES_DB: apimonitor
      POSTGRES_USER: ${POSTGRES_USER:-apimonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apimonitor_dev}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d apimonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: apimonitor-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-apimonitor}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-apimonitor_dev}
    ports:
      - "${MONGO_PORT:-27019}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  mongo-data:
